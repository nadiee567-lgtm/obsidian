<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBSIDIAN</title><style>
*{{margin:0;padding:0;box-sizing:border-box}}
body{{background:#15171b;color:#c2c6cc;font-family:'SF Mono',ui-monospace,Consolas,monospace;
  min-height:100vh;display:flex;align-items:center;justify-content:center}}
.box{{background:#1a1d22;border:1px solid #2c313a;border-radius:0;padding:32px;width:280px}}
.box h1{{font-size:.95rem;font-weight:600;letter-spacing:.12em;margin-bottom:20px;color:#c2c6cc}}
input{{width:100%;background:#15171b;border:1px solid #2c313a;border-radius:0;color:#c2c6cc;
  padding:9px 10px;font-family:inherit;font-size:.85rem;outline:none;margin-bottom:12px}}
input:focus{{border-color:#6f8aa8}}
button{{width:100%;background:#2c313a;color:#c2c6cc;border:none;border-radius:0;
  padding:9px;font-family:inherit;font-size:.8rem;font-weight:600;letter-spacing:.05em;cursor:pointer}}
button:hover{{background:#3a3f48}}
.err{{color:#a86a70;font-size:.75rem;margin-bottom:12px}}
</style></head><body>
<div class="box"><h1>OBSIDIAN</h1>
{error_html}
<form method="POST"><input type="password" name="password" placeholder="password" autofocus>
<button type="submit">ENTER</button></form></div>
</body></html>
