<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBSIDIAN</title><style>
*{{margin:0;padding:0;box-sizing:border-box}}
body{{background:#0a0a0f;color:#c9c9d4;font-family:'SF Mono',ui-monospace,Consolas,monospace;
  min-height:100vh;display:flex;align-items:center;justify-content:center}}
.box{{background:#111117;border:1px solid #24242e;border-radius:6px;padding:32px;width:280px}}
.box h1{{font-size:.95rem;font-weight:600;letter-spacing:.12em;margin-bottom:20px;color:#e4e4ec}}
input{{width:100%;background:#0a0a0f;border:1px solid #24242e;border-radius:4px;color:#c9c9d4;
  padding:9px 10px;font-family:inherit;font-size:.85rem;outline:none;margin-bottom:12px}}
input:focus{{border-color:#5c5c70}}
button{{width:100%;background:#5c5c70;color:#e4e4ec;border:none;border-radius:4px;
  padding:9px;font-family:inherit;font-size:.8rem;font-weight:600;letter-spacing:.05em;cursor:pointer}}
button:hover{{background:#6e6e85}}
.err{{color:#e0685c;font-size:.75rem;margin-bottom:12px}}
</style></head><body>
<div class="box"><h1>OBSIDIAN</h1>
{error_html}
<form method="POST"><input type="password" name="password" placeholder="contraseña" autofocus>
<button type="submit">ENTRAR</button></form></div>
</body></html>
