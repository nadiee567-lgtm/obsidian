services:
  obsidian:
    build: .
    image: obsidian:latest
    container_name: obsidian
    # Host-only by default — NOT exposed to the network. For remote access use
    # Tailscale on the host; do not open this port to the LAN.
    ports:
      - "127.0.0.1:8767:8767"
    environment:
      # Change it. Without this, the server generates a random one and prints it to the log.
      OBSIDIAN_PASSWORD: "${OBSIDIAN_PASSWORD:-changeme}"
      # ntfy topic for monitor alerts (optional)
      OBSIDIAN_NTFY: "${OBSIDIAN_NTFY:-}"
    volumes:
      - obsidian-data:/root/.obsidian
    restart: unless-stopped

volumes:
  obsidian-data:
